<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="berat erdoğan — art director">
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- the record: sleeve + vinyl, same motif as the site -->
  <g transform="translate(756 150)">
    <circle cx="300" cy="180" r="180" fill="#101010"/>
    <g fill="none" stroke="#1d1d1d" stroke-width="2">
      <circle cx="300" cy="180" r="166"/><circle cx="300" cy="180" r="150"/>
      <circle cx="300" cy="180" r="134"/><circle cx="300" cy="180" r="118"/>
      <circle cx="300" cy="180" r="102"/><circle cx="300" cy="180" r="86"/>
    </g>
    <circle cx="300" cy="180" r="66" fill="#E5261A"/>
    <circle cx="300" cy="180" r="7" fill="#FFFFFF"/>
    <rect x="0" y="0" width="360" height="360" fill="#1B1B3A"/>
    <text x="24" y="44" font-family="Inter Tight, Helvetica, Arial, sans-serif" font-size="17"
          fill="#E8924A" letter-spacing="3" opacity="0.85">SELECTED WORK</text>
    <text x="24" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="62"
          fill="#E8924A" letter-spacing="-2">berat.</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#000000">
    <text x="72" y="268" font-size="128" letter-spacing="-6">berat</text>
    <text x="72" y="388" font-size="128" letter-spacing="-6">erdoğan<tspan fill="#E5261A">.</tspan></text>
  </g>

  <g font-family="Inter Tight, Helvetica, Arial, sans-serif" fill="#6C6C6C" letter-spacing="3">
    <text x="74" y="150" font-size="21">ART DIRECTOR · İSTANBUL</text>
    <text x="74" y="556" font-size="21">MARKA KİMLİĞİ · MOTION · TİPOGRAFİ · KAMPANYA</text>
  </g>

  <line x1="72" y1="500" x2="1128" y2="500" stroke="#000000" stroke-width="1" opacity="0.18"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="berat erdoğan — art director">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <!-- the record: sleeve + vinyl, same motif as the site; kept inside the frame -->
  <g transform="translate(700 135)">
    <circle cx="250" cy="180" r="180" fill="#101010"/>
    <g fill="none" stroke="#1d1d1d" stroke-width="2">
      <circle cx="250" cy="180" r="160"/><circle cx="250" cy="180" r="140"/>
      <circle cx="250" cy="180" r="120"/><circle cx="250" cy="180" r="100"/>
    </g>
    <circle cx="250" cy="180" r="62" fill="#E5261A"/>
    <circle cx="250" cy="180" r="7" fill="#FFFFFF"/>
    <rect x="0" y="0" width="360" height="360" fill="#1B4D3E"/>
    <text x="26" y="48" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="500" fill="#EDE5B6" letter-spacing="4">SELECTED WORK</text>
    <text x="24" y="330" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#EDE5B6" letter-spacing="-3">berat.</text>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#000000" font-weight="700" letter-spacing="-7">
    <text x="68" y="282" font-size="140">berat</text>
    <text x="68" y="410" font-size="140">erdoğan<tspan fill="#E5261A" font-size="70">.</tspan></text>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#6C6C6C" font-weight="500" letter-spacing="3">
    <text x="72" y="150" font-size="20">ART DIRECTOR · İSTANBUL</text>
    <text x="72" y="560" font-size="20">MARKA KİMLİĞİ · MOTION · TİPOGRAFİ · KAMPANYA</text>
  </g>
  <line x1="72" y1="505" x2="640" y2="505" stroke="#000000" stroke-width="1" opacity="0.18"/>
</svg>
